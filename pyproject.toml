[project]
name = "computer-vision"
version = "0.1.0"
description = "Animal instance segmentation, eye localization, and pixel distance measurement."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Dataset reading and numerical operations
    "numpy==1.26.4",
    "pillow>=12.3.0",
    # Compatibility with torchvision 0.16
    "setuptools==69.5.1",
    # Model inference
    "torch==2.1.0",
    "torchvision==0.16.0",
    "mmcv==2.1.0",
    "mmengine==0.10.7",
    "mmpose==1.3.2",
    # MMPose 1.3.2 imports RTMO heads through its public inference API.
    "mmdet==3.2.0",
    "opencv-python==4.11.0.86",
    "segment-anything==1.0",
    "ultralytics==8.4.184",
    "pycocotools>=2.0.11",
    "scipy>=1.17.1",
]

[tool.uv]
package = false

# Target environment for the CUDA-enabled inference dependencies
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
]

# chumpy is a transitive MMPose dependency with undeclared build requirements.
# These tools are confined to its isolated build environment.
[tool.uv.extra-build-dependencies]
chumpy = ["pip==24.3.1", "setuptools==69.5.1"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

# Precompiled for CPython 3.11, Linux x86_64, PyTorch 2.1, CUDA 11.8
mmcv = { url = "https://download.openmmlab.com/mmcv/dist/cu118/torch2.1.0/mmcv-2.1.0-cp311-cp311-manylinux1_x86_64.whl" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
